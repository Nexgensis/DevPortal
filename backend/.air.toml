# Air configuration for live-reload during local dev.
# Docs: https://github.com/air-verse/air

root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  # Build into ./tmp/main; then run that binary.
  cmd = "go build -o ./tmp/main ."
  bin = "tmp/main"
  full_bin = ""
  args_bin = []

  # Watch only what we care about. Don't watch tmp/ (where the binary lands)
  # or migrations data we shouldn't re-trigger on.
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "node_modules"]
  include_dir = []
  exclude_file = []
  exclude_regex = ["_test\\.go"]

  # Debouncing — wait 200ms after a file save before rebuilding.
  delay = 200

  # Stop the running binary before starting a new one.
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

  # Surface build errors in the container logs.
  log = "build-errors.log"

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[log]
  time = true

[misc]
  clean_on_exit = true
