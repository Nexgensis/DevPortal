server {
  listen 80;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  # Allow wiki image uploads. The backend caps the file at 5 MB and returns a
  # friendly error itself, so keep nginx comfortably above that (multipart
  # overhead + headroom) — otherwise nginx's 1 MB default rejects uploads with a
  # bare "413 Request Entity Too Large" before they ever reach the backend.
  client_max_body_size 10m;

  # Serve static frontend files
  location / {
    # Try to serve file, if not found (SPA route), fallback to index.html
    try_files $uri $uri/ /index.html;
  }
  
  # Database restores upload whole SQL dumps, which blow past the 10m cap above.
  # Longest-prefix match wins, so this overrides `location /api/` for this one
  # endpoint and leaves the tight limit in place everywhere else.
  location /api/postgres/restore {
    client_max_body_size 0;
    proxy_pass http://backend:8080/api/postgres/restore;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite (never append) the client IP headers: the backend trusts
    # X-Forwarded-For only from this proxy, and uses it for audit logs and
    # the vault's MFA rate limiting. Appending would let a client prepend a
    # forged address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    # A large restore streams SQL through psql for as long as it takes and sends
    # nothing back until it finishes, so nginx sits idle on the upstream the
    # whole time. The 60s default cuts the connection mid-restore, which cancels
    # the request context and kills psql, leaving a half-populated database.
    proxy_read_timeout 6h;
    proxy_send_timeout 6h;
  }

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection keep-alive;
    proxy_set_header Host $host;
    # Overwrite (never append) the client IP headers: the backend trusts
    # X-Forwarded-For only from this proxy, and uses it for audit logs and
    # the vault's MFA rate limiting. Appending would let a client prepend a
    # forged address.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_cache_bypass $http_upgrade;
  }

  # Wiki image uploads are written to disk by the backend and served by its
  # static handler at /uploads/wiki/<file>. Without this, <img src="/uploads/…">
  # falls into `location /` above, gets the SPA index.html via try_files, and
  # the image renders broken. Proxy it straight to the backend (mirrors the
  # /uploads proxy the dev Vite server already has).
  location /uploads/ {
    proxy_pass http://backend:8080/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  error_page 404 /404.html;
}
