<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7B6BFF"/>
      <stop offset="1" stop-color="#4A38D6"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#EEEBFF"/>
    </linearGradient>
  </defs>

  <!-- bright violet app tile (matches the light UI primary accent #5B4DFF) -->
  <rect x="0" y="0" width="100" height="100" rx="24" fill="url(#tile)"/>
  <!-- soft top highlight for a little depth -->
  <rect x="0" y="0" width="100" height="50" rx="24" fill="#ffffff" opacity="0.08"/>

  <!-- bold N monogram -->
  <path d="M30 74 L30 28 L70 74 L70 28"
        fill="none" stroke="url(#ink)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- coral "aura" spark at the rising corner (echoes the app's coral accent) -->
  <circle cx="70" cy="28" r="7.5" fill="#FF5A5F"/>
</svg>
