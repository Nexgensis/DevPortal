services:
  db:
    image: postgres:16
    container_name: webmanager-database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexgensis
      POSTGRES_DB: webmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d webmanager" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

  backend:
    build:
      context: ./backend
    container_name: webmanager-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_DSN: "postgres://postgres:nexgensis@db:5432/webmanager?sslmode=disable"
      PORT: 8080
      JWT_SECRET: "r2dhNc6ePdPQBeZc5yMULGNF3/pC8ACWdMX7tkZPOiU="
      ENCRYPTION_KEY: "12345678901234567890123456789012"
      GIN_MODE: debug
      SSO_ENABLED: "true"
      MICROSOFT_CLIENT_ID: dcf16509-91a6-43a0-b0b2-85fe33d7a43f
      MICROSOFT_TENANT_ID: e37bae5a-2850-45a2-9ed0-a198cb1388fd
      MICROSOFT_CLIENT_SECRET: G9x8Q~5k2DR_pEsNgAr2sQT0Qy5SaHJeqTNVAaQ~
      MICROSOFT_REDIRECT_URI: https://portal.nexgensis.com/api/auth/microsoft/callback
      FRONTEND_URL: https://portal.nexgensis.com
      SSO_AUTO_CREATE_USERS: "true"
      SSO_DEFAULT_ROLE: user
      SSO_ADMIN_EMAILS: sourav.kumar@nexgensis.com
      NEXUS_URL: "${NEXUS_URL:-https://nexus.nexgensis.com}"
      NEXUS_USER: "${NEXUS_USER:-admin}"
      NEXUS_PASS: "${NEXUS_PASS:-Welcome@123}"
    ports:
      - "8080:8080"
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

  frontend:
    build:
      context: ./frontend
    container_name: webmanager-frontend
    ports:
      - "10000:80"
    depends_on:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

volumes:
  pgdata:
