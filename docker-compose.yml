services:
  db:
    image: postgres:16
    container_name: webmanager-database
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}"
      POSTGRES_DB: webmanager
    # Not published to the host: only the backend on the compose network needs
    # it, and exposing 5432 puts the database on every interface of the box.
    # Re-add a "127.0.0.1:5432:5432" mapping if you need local psql access.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d webmanager" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

  backend:
    build:
      context: ./backend
    container_name: webmanager-backend
    depends_on:
      db:
        condition: service_healthy
    # Every value below comes from the environment (a .env file beside this
    # compose file, or real env vars). No secret is written here — this file is
    # committed, so anything inline is readable by everyone with repo access and
    # stays in git history forever. See .env.example for the full list.
    #
    # `${VAR:?message}` makes compose refuse to start when a required secret is
    # missing, instead of silently booting with an empty one.
    environment:
      DB_DSN: "postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/webmanager?sslmode=disable"
      PORT: 8080
      JWT_SECRET: "${JWT_SECRET:?set JWT_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?set ENCRYPTION_KEY (must be 16, 24 or 32 bytes)}"
      GIN_MODE: "${GIN_MODE:-release}"
      SSO_ENABLED: "${SSO_ENABLED:-true}"
      MICROSOFT_CLIENT_ID: "${MICROSOFT_CLIENT_ID}"
      MICROSOFT_TENANT_ID: "${MICROSOFT_TENANT_ID}"
      MICROSOFT_CLIENT_SECRET: "${MICROSOFT_CLIENT_SECRET}"
      MICROSOFT_REDIRECT_URI: "${MICROSOFT_REDIRECT_URI}"
      FRONTEND_URL: "${FRONTEND_URL}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-${FRONTEND_URL}}"
      SSO_AUTO_CREATE_USERS: "${SSO_AUTO_CREATE_USERS:-true}"
      SSO_DEFAULT_ROLE: "${SSO_DEFAULT_ROLE:-user}"
      SSO_ADMIN_EMAILS: "${SSO_ADMIN_EMAILS}"
      # Optional: seeds the break-glass admin on a fresh database only. Leave
      # unset and the backend generates a password and logs it once on first boot.
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-}"
      NEXUS_URL: "${NEXUS_URL:-}"
      NEXUS_USER: "${NEXUS_USER:-}"
      NEXUS_PASS: "${NEXUS_PASS:-}"
    ports:
      - "8080:8080"
    volumes:
      # Persist wiki image uploads (written to /app/uploads/wiki) so they
      # survive container recreation/redeploys. Without this, every backend
      # rebuild wipes all uploaded cover images.
      - wiki-uploads:/app/uploads
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

  frontend:
    build:
      context: ./frontend
    container_name: webmanager-frontend
    ports:
      - "10000:80"
    depends_on:
      - backend
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4g

volumes:
  pgdata:
  wiki-uploads:
